services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-myproject_db}
      POSTGRES_USER: ${DB_USER:-myproject_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-myproject_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_EXTERNAL_PORT:-5433}:${DB_PORT:-5432}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-myproject_user} -d ${DB_NAME:-myproject_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_EXTERNAL_PORT:-6380}:${REDIS_PORT:-6379}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: FamEdu/
    entrypoint: ["./entrypoint.sh"]
    env_file:
      - .env
    volumes:
      - ./FamEdu:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build: FamEdu/
    env_file:
      - .env
    command: celery -A FamEdu worker -l info
    volumes:
      - ./FamEdu:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data: